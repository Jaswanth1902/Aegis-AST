[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ast"
version = "1.0.0"
description = "Zero-dependency, sub-second Python AST & secret security linter for codebases and CI/CD pipelines."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "K. Sai Jaswanth Reddy", email = "jaswanthreddy1902@gmail.com" }
]
keywords = [
    "security",
    "ast",
    "sast",
    "linter",
    "secret-scanner",
    "sql-injection",
    "devsecops",
    "static-analysis"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
aegis = "aegis:main"
aegis-ast = "aegis:main"

[project.urls]
Homepage = "https://github.com/Jaswanth1902/Aegis-AST"
Repository = "https://github.com/Jaswanth1902/Aegis-AST"
Issues = "https://github.com/Jaswanth1902/Aegis-AST/issues"
